# smithing default config.
# D2RLoader writes this to d2rloader/config/smithing.toml if it is missing.
# Changes take effect on the next game start.

[smithing]
# false = the plugin loads but does nothing.
enabled = true

# true = extra lines in the D2RLoader log for troubleshooting (a grid size check
# and the first anvil / grid click of each game start). Leave false normally.
diagnostics = false

# Smith's Shop material slots. One entry per slot: "code, x, y" with optional
# ", next" (next tier, for the salvage bonus material) and ", name key" (string
# for messages). An entry with no code (", x, y") draws an empty frame.
# x / y = top-left of the 98 x 98 slot inside the window (1162 x 1507).
# Free space: the 3 x 3 block on the right and the band above the anvil (y 544).
# At most 60 entries. Leave the list out to get these defaults.
[shop]
slots = [
  "wd1, 102, 232, wd2", "mt1, 206, 232, mt2", "st1, 310, 232, st2", "sg1, 414, 232, sg2", "lt1, 518, 232, lt2", "fr1, 622, 232, fr2",
  "wd2, 102, 336, wd3", "mt2, 206, 336, mt3", "st2, 310, 336, st3", "sg2, 414, 336, sg3", "lt2, 518, 336, lt3", "fr2, 622, 336, fr3",
  "wd3, 102, 440",      "mt3, 206, 440",      "st3, 310, 440",      "sg3, 414, 440",      "lt3, 518, 440",      "fr3, 622, 440",
  "bpa, 754, 232, , BpArmor", "bpb, 858, 232, , BpBootsBelt", "bpc, 962, 232, , BpOffhand",
  "bpd, 754, 336, , BpCaster", "bpe, 858, 336, , BpAxeSword", "bpf, 962, 336, , BpBowCrossbow",
  "bpg, 754, 440, , BpScepterDagger", "bph, 858, 440, , BpBlunt", "bpi, 962, 440, , BpSpearPolearm",
]

# Material pickup: listed items are picked up automatically when you walk near
# them and go straight into the stash Materials tab. If the Materials tab is full
# for that item, or the pickup has no inventory room, the item stays on the ground.
[pickup]
# Master switch.
enabled = true

# Item codes to collect. Each item needs AdvancedStashStackable = 1 in misc.txt
# and a slot in the Materials tab. Default: the smithing materials
# (wood, metal, stone, string, leather, fur; tiers 1-3).
codes = [
  "wd1", "wd2", "wd3",
  "mt1", "mt2", "mt3",
  "st1", "st2", "st3",
  "sg1", "sg2", "sg3",
  "lt1", "lt2", "lt3",
  "fr1", "fr2", "fr3",
  "bpa", "bpb", "bpc", "bpd", "bpe", "bpf", "bpg", "bph", "bpi",
]

# Pickup distance (same units as normal pickup; 1-20).
range = 4

# Look for items every this many server frames (25 frames = 1 second; 1-25).
scan_frames = 5

# Most items stored per player per scan (1-16).
max_per_scan = 4

# true = write each pickup / skip to the D2RLoader log.
log_pickups = false

# true = materials from the codes list that land in your inventory (for example
# picked up by hand before the automatic pickup got them) also go to their slot.
store_from_inventory = true

# Recipe book pages per smith level - written by tools/smithing/make_recipe_book.py, do not edit.
[book]
pages = [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]
